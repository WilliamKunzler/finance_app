services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: finance
      POSTGRES_PASSWORD: finance
      POSTGRES_DB: finance_app
    ports:
      - "5433:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finance -d finance_app"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  finance-app:
    build: .
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: "postgresql://finance:finance@db:5432/finance_app?schema=public"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pg-data:
